<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>E-learning Rust</title>
</head>
<body>
    <div class="topbar">
        <div class="burger" onclick="toggleSidebar()">🍔</div>
        <!-- <div class="burger" onclick="toggleSidebar()">&#9776;</div> -->
        <div class="title_text">Rust E-learning 🦀</div>
    </div>
    <div class="container">
        <aside class="sidebar hidden" id="sidebar">
            <h2 class="center">Seznam kapitol:</h2>
            <ul class="chapter-list" id="chapter-list"></ul>
        </aside>
        <script src="scripts/chapter-list.js"  onload="insertChapters()"></script>

        <main class="main">
            <div class="chapter-title center">Název kapitoly</div>
            <div class="video-container">
                <video controls>
                    <!-- <source src="video/sample-video2.mkv" id="video" onload="setVideo()"> -->
                    Váš prohlížeč nepodporuje přehrávání videa.
                </video>
            </div>
            <script src="scripts/video.js" defer></script>
            
            <div class="additional-info">
                Info / kvíz / timestampy
            </div>
        </main>
    </div>

    <div id="foot" class="foot"></div>



</body>
    <script src="scripts/foot.js" onload="createFoot()"></script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('show');
        }
    </script>

</html>
