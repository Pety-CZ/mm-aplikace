<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>E-learning Rust</title>
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
</head>

<body>
    <div class="topbar">
        <div class="burger" onclick="toggleSidebar()">🍔</div>
        <!-- <div class="burger" onclick="toggleSidebar()">&#9776;</div> -->
        <div class="title_text">Rust E-learning 🦀</div>
    </div>
    <div class="container">
        <aside class="sidebar show" id="sidebar">
			<h2 class="center">Seznam kapitol:</h2>
			<ul class="chapter-list" id="chapter-list"></ul>
        </aside>

		<main class="main">
            <div class="chapter-title center" id="chapter-title">Název kapitoly</div>
            <div class="chapter-info additional-info" id="chapter-info">Shrnutí kapitoly</div>
            <div class="video-container" id="video-container">
                <div id="quiz-container" class="additional-info">
                    <h4>Kvíz</h4>
                    <div id="quiz-result" class="additional-info"></div>
                    <div id="quiz" class="additional-info"></div>
                </div>
                <video id="video" controls preload="metadata">
                    <source id="video-source" src="" type="video/mp4">
                    Váš prohlížeč nepodporuje přehrávání videa nebo nemáte povolený JavaScript.
                </video>
            </div>



            <div id="extra-info" class="additional-info">
                <!-- Oficiální dokumentace: <a href="https://doc.rust-lang.org/book/" target="_blank">https://doc.rust-lang.org/book/</a> -->
            </div>
        </main>
    </div>

    <div id="foot" class="foot">
        <script src="scripts/foot.js" onload="createFoot()"></script>
    </div>

    <script src="scripts/video.js"></script>
    <script src="scripts/chapters.js"></script>
    <script src="scripts/quiz.js"></script>
    <script src="scripts/engine.js" defer"></script>

</body>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('show');
        }
    </script>
</html>
